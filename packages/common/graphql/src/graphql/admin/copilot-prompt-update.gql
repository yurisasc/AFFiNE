mutation updatePrompt(
  $name: String!
  $messages: [CopilotPromptMessageInput!]!
  $model: String!
) {
  updateCopilotPrompt(name: $name, messages: $messages, model: $model) {
    name
    model
    action
    config {
      frequencyPenalty
      presencePenalty
      temperature
      topP
    }
    messages {
      role
      content
      params
    }
  }
}
